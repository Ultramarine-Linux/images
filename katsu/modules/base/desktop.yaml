dnf:
  releasever: 44
  exec: dnf5
  packages:
    - taidan-ultramarine-configs
    - ultramarine-langpacks-core-en
    - ultramarine-langpacks-fonts-en
    - ultramarine-default-fonts-core-sans
    - ultramarine-default-fonts-core-serif
    #- adobe-source-han-sans-fonts
    #- adobe-source-han-serif-fonts
  exclude: # to save space
    - akonadi-server-mysql
    - mariadb
    - default-fonts-*
    - podman
    - ibus-handwrite-ja
    - langpacks-*
    - im-chooser
    - toolbox
