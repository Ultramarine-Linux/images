builder: dnf

import:
  - ../base/base.yaml
  - ../base/desktop.yaml
  - ../live/live.yaml
  - ../live/anaconda.yaml
  - niri.yaml

distro: Ultramarine Niri 45

out_file: ultramarine-niri-45-live-anaconda.iso

bootloader: grub

kernel_cmdline: "quiet rhgb"

iso:
  volume_id: UM-Niri-Live-Anaconda

scripts:
  post:
    - id: niri  # need for noctalia-greeter appearance, remove if skipping greeter like zirconium does?
      name: Set up niri
      file: niri.sh
    - id: niri-live
      name: Set up niri Live
      file: niri-live.sh
    - id: niri-live-anaconda
      name: Set up niri Live (for Anaconda)
      file: niri-live-anaconda.sh

dnf:
  releasever: 45
  exec: dnf5
