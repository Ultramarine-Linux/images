builder: dnf

import:
  - mt8183.yaml
  - ../../../xfce/xfce.yaml
  - ../../../xfce/base-disk-aarch64.yaml

distro: Ultramarine Xfce 45 for mt8183 Chromebook

out_file: ultramarine-cb-mt8183-xfce-45.img

bootloader: grub

kernel_cmdline: "quiet rhgb"

dnf:
  releasever: 45
  exec: dnf5
  exclude:
    - ultramarine-release-identity-xfce
  packages:
    - ultramarine-release-identity-xfce-chromebook
