builder: dnf

import:
  - sc7180.yaml
  - ../../../xfce/xfce.yaml
  - ../../../xfce/base-disk-aarch64.yaml

distro: Ultramarine Xfce 45 for sc7180 Chromebook

out_file: ultramarine-cb-sc7180-xfce-45.img

bootloader: grub

kernel_cmdline: "quiet rhgb"

dnf:
  releasever: 45
  exec: dnf5
  exclude:
    - ultramarine-release-identity-xfce
  packages:
    - ultramarine-release-identity-xfce-chromebook
