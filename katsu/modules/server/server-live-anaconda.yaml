builder: dnf

import:
  - ../base/base.yaml
  - server.yaml

distro: Ultramarine Linux 44 (Server Edition)

out_file: ultramarine-server-44-live-anaconda.iso

bootloader: grub

kernel_cmdline: "quiet rhgb"

iso:
  volume_id: UM-Srv-Live-Anaconda

scripts:
  post:
    - id: server-anaconda-branding
      name: Apply Ultramarine Anaconda branding
      file: server-anaconda-branding.sh

dnf:
  releasever: 44
  exec: dnf5
  packages:
    # Fedora's standard live-media runtime used by anaconda-live.
    - kernel
    - glibc-all-langpacks
    - dracut-live
    - dracut-network
    - dracut-squash
    - isomd5sum
    - livesys-scripts
    - rsync
    - anaconda-dracut
    - anaconda-live
    - anaconda-install-env-deps
    - "@anaconda-tools"
