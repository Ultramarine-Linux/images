builder: dnf4

import:
  - ../base/base.yaml
  - ../live/live.yaml
  - ../base/desktop.yaml
  - ../live/readymade.yaml
  - xfce.yaml

distro: Ultramarine Linux 44 (Xfce Edition)

out_file: ultramarine-xfce-44-live.iso

bootloader: grub

kernel_cmdline: "quiet rhgb"

iso:
  volume_id: UM-Xfce-Live

scripts:
  post:
    - id: xfce-live
      name: Set up XFCE Live
      file: ./xfce-live.sh

dnf:
  releasever: 44
  exec: dnf5
