builder: dnf

import:
  - ../base/base.yaml
  - ../live/live.yaml
  - ../base/desktop.yaml
  - ../live/readymade.yaml
  - xfce.yaml

distro: Ultramarine Xfce Cheetah

out_file: ultramarine-xfce-cheetah-live.iso

bootloader: grub

kernel_cmdline: "quiet rhgb"

iso:
  volume_id: UM-Xfce-Live

scripts:
  post:
    - id: xfce-live
      name: Set up XFCE Live
      file: ./xfce-live.sh

dnf:
  releasever: rawhide
  exec: dnf5
