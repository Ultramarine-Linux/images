dnf:
  releasever: 45
  exec: dnf5
  exclude:
    - "dnfdragora*"
    - dnfdragora-updater
    - desktop-backgrounds-compat
    # fedora's xfce-desktop group hard-lists it, nano is the default
    - vim-enhanced
  packages:
    - "@ultramarine-xfce-product-environment"
    - "@ultramarine-xfce-no-flatpak-apps"
    - ultramarine-release-xfce
    - ultramarine-release-identity-xfce
